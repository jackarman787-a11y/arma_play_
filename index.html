<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARMA PLAY</title>
    <style>
        /* --- CSS STYLING (Spotify Look) --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: white; padding-bottom: 80px; }
        
        /* Header */
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px; }
        .logo { font-size: 22px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .logo-circle { background: #ff69b4; color: white; width: 35px; height: 35px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; }
        .logo-text span { color: #1DB954; }
        .header-icons button { background: none; border: none; color: white; font-size: 20px; margin-left: 15px; cursor: pointer; }

        /* Tabs */
        .tabs { display: flex; gap: 10px; padding: 0 15px; margin-bottom: 15px; }
        .tab { background: #2a2a2a; border: none; color: white; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: 500;}
        .tab.active { background: #1DB954; color: black; }

        /* Cards Grid */
        .section-title { padding: 0 15px; font-size: 20px; font-weight: bold; margin-bottom: 10px; margin-top: 10px;}
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 15px; }
        .card { background: #181818; border-radius: 8px; overflow: hidden; display: flex; align-items: center; cursor: pointer; transition: 0.3s; }
        .card:hover { background: #282828; }
        .card-img { width: 60px; height: 60px; object-fit: cover; }
        .card-title { padding: 10px; font-size: 14px; font-weight: bold; }

        /* Settings Modal (Popup) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #282828; padding: 20px; border-radius: 10px; width: 80%; max-width: 300px; }
        .modal-content h3 { margin-bottom: 15px; }
        .modal-content p { margin-bottom: 10px; font-size: 14px; color: #b3b3b3; }
        .close-btn { background: #1DB954; color: black; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 15px;}

        /* Bottom Player */
        .bottom-player { position: fixed; bottom: 0; left: 0; width: 100%; background: #1DB954; color: black; display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; z-index: 999; }
        .player-info { display: flex; flex-direction: column; overflow: hidden; width: 70%; }
        .player-info span { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-info small { font-size: 12px; opacity: 0.8; }
        .player-controls button { background: none; border: none; font-size: 24px; cursor: pointer; }

        /* Loading Spinner */
        #loader { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 4px solid #333; border-top: 4px solid #1DB954; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; z-index: 1001; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <div class="logo-circle">A</div>
            <div class="logo-text">ARMA <span>PLAY</span></div>
        </div>
        <div class="header-icons">
            <button onclick="alert('Search button clicked!')">🔍</button>
            <button onclick="openSettings()">⚙️</button>
        </div>
    </header>

    <!-- Greeting -->
    <div class="section-title">Good Morning</div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab active" onclick="showTab('All')">All</button>
        <button class="tab" onclick="showTab('Music')">Music</button>
        <button class="tab" onclick="showTab('Podcasts')">Podcasts</button>
    </div>

    <!-- Cards -->
    <div class="grid-container" id="song-grid">
        <!-- Cards will be injected here via JS -->
        <div class="card" style="opacity: 0.5;"><div class="card-title">Loading...</div></div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3>Settings</h3>
            <p>✅ Audio Quality: High</p>
            <p>✅ Dark Mode: On</p>
            <p>✅ Online API: Connected</p>
            <button class="close-btn" onclick="closeSettings()">Close Settings</button>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loader"></div>

    <!-- Bottom Player -->
    <div class="bottom-player">
        <div class="player-info">
            <span id="player-title">No song playing</span>
            <small id="player-subtitle">ARMA PLAY</small>
        </div>
        <div class="player-controls">
            <button id="play-pause-btn" onclick="togglePlay()">▶</button>
        </div>
    </div>

    <!-- Hidden Audio Element -->
    <audio id="audio-player"></audio>

    <!-- JavaScript -->
    <script>
        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-pause-btn');
        const playerTitle = document.getElementById('player-title');
        const playerSub = document.getElementById('player-subtitle');
        const loader = document.getElementById('loader');
        const songGrid = document.getElementById('song-grid');

        // 1. Settings Modal Logic
        function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }

        // 2. Tabs Logic
        function showTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            // For demo, just alerting
            console.log("Switched to: " + tabName);
        }

        // 3. Play/Pause Toggle
        function togglePlay() {
            if (audio.src === "") {
                alert("Please select a song first by clicking on the cards!");
                return;
            }
            if (audio.paused) {
                audio.play();
                playBtn.innerHTML = "⏸";
            } else {
                audio.pause();
                playBtn.innerHTML = "▶";
            }
        }

        // 4. Fetch Songs from JioSaavn API (Unofficial)
        // Note: If this API fails, it might be down. We are using a reliable mirror.
        async function fetchSongs() {
            loader.style.display = 'block';
            try {
                // Search query for popular Bollywood songs (aap yahan 'arijit singh' ya kuch aur bhi likh sakte hain)
                const response = await fetch('https://saavn.dev/api/search/songs?query=atif%20aslam&limit=10');
                const data = await response.json();
                
                songGrid.innerHTML = ''; // Clear loading
                
                if(data.success && data.data.results.length > 0) {
                    data.data.results.forEach(song => {
                        // Get high quality image and audio URL
                        const image = song.image[2].url || song.image[1].url;
                        const audioUrl = song.downloadUrl[4].url || song.downloadUrl[3].url; // Highest quality
                        const title = song.name;
                        const artist = song.artists.primary[0].name;

                        // Create Card
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.onclick = () => playSong(audioUrl, title, artist);
                        card.innerHTML = `
                            <img src="${image}" class="card-img" alt="cover">
                            <div class="card-title">${title}</div>
                        `;
                        songGrid.appendChild(card);
                    });
                } else {
                    songGrid.innerHTML = '<div style="color:red">API Error: Songs not found.</div>';
                }
            } catch (error) {
                console.error("API Error:", error);
                songGrid.innerHTML = '<div style="color:red">Network Error: API se connect nahi ho paya.</div>';
            } finally {
                loader.style.display = 'none';
            }
        }

        // 5. Play Song Function
        function playSong(url, title, artist) {
            audio.src = url;
            playerTitle.innerText = title;
            playerSub.innerText = artist;
            audio.play();
            playBtn.innerHTML = "⏸";
        }

        // Initialize App
        window.onload = () => {
            fetchSongs();
        };
    </script>
</body>
</html>
