<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>ARMA PLAY — Music</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topbar">
    <div class="logo">ARMA <span>PLAY</span></div>
    <button id="menuBtn" aria-label="Menu">☰</button>
  </header>

  <main class="container">

    <section class="welcome">
      <p class="gold-text">YOUR MUSIC. YOUR WORLD.</p>
      <h1>Feel Every <span>Beat.</span></h1>
      <p>Discover music and enjoy every moment.</p>
    </section>

    <section class="search-section">
      <input
        type="search"
        id="searchInput"
        placeholder="Search songs or artists..."
        autocomplete="off"
      >
      <button id="searchBtn">SEARCH</button>
    </section>

    <p id="statusMsg" role="status">Welcome to ARMA PLAY</p>

    <section class="music-section">
      <h2>Discover Music</h2>
      <div id="songList" class="song-list"></div>
    </section>

    <section class="player">
      <img
        id="coverArt"
        src="https://placehold.co/400x400/151515/d4af37?text=ARMA+PLAY"
        alt="Album cover"
      >

      <div class="track-info">
        <h2 id="songTitle">Select a Song</h2>
        <p id="artistName">ARMA PLAY</p>
      </div>

      <audio id="audioPlayer" preload="metadata"></audio>

      <div class="progress-container">
        <span id="currentTime">0:00</span>
        <input
          type="range"
          id="progressBar"
          min="0"
          max="100"
          value="0"
        >
        <span id="totalTime">0:00</span>
      </div>

      <div class="controls">
        <button id="previousBtn" aria-label="Previous">⏮</button>
        <button id="playPauseBtn" aria-label="Play">▶</button>
        <button id="nextBtn" aria-label="Next">⏭</button>
      </div>

      <button id="downloadBtn" class="download-btn">
        Download
      </button>
    </section>

  </main>

  <footer>
    <p>© 2026 ARMA PLAY · All Rights Reserved</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
