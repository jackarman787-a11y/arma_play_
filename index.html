<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spotify Clone</title>
    <style>
        /* =========================================
           GLOBAL SPOTIFY STYLING
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            padding-bottom: 140px;
            overflow-x: hidden;
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            margin: 24px 20px 16px 20px;
            letter-spacing: -0.5px;
        }

        /* =========================================
           TOP HEADER & SEARCH
           ========================================= */
        .header-container {
            position: sticky;
            top: 0;
            background-color: #121212;
            z-index: 100;
            padding-bottom: 10px;
        }

        .top-nav {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            background-color: #ff8f9f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
        }

        .nav-pill {
            background-color: #2a2a2a;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 30px;
            border: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .nav-pill.active {
            background-color: #1ed760;
            color: #000000;
        }

        .search-container {
            padding: 0 20px;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 12px 16px;
        }

        .search-bar input {
            background: none;
            border: none;
            color: white;
            width: 100%;
            margin-left: 12px;
            font-size: 16px;
            outline: none;
            font-weight: 500;
        }
        
        .search-bar input::placeholder { color: #a7a7a7; }

        /* =========================================
           CARDS & GRID (LIKE SPOTIFY)
           ========================================= */
        .horizontal-scroll {
            display: flex;
            overflow-x: auto;
            gap: 16px;
            padding: 0 20px 20px 20px;
            scroll-behavior: smooth;
        }

        .horizontal-scroll::-webkit-scrollbar { display: none; }

        .music-card {
            min-width: 150px;
            max-width: 150px;
            cursor: pointer;
            padding: 12px;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }

        .music-card:hover {
            background-color: #2a2a2a;
        }

        .music-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 6px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .music-card .title {
            font-size: 16px;
            font-weight: 700;
            margin-top: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .music-card .subtitle {
            font-size: 14px;
            color: #a7a7a7;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* =========================================
           BOTTOM PLAYER (FIXED)
           ========================================= */
        .bottom-player {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: #181818;
            border-top: 1px solid #282828;
            padding: 12px 20px 20px 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .player-top {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
        }

        .track-details {
            width: 100px;
        }

        .track-details h3 {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-details p {
            font-size: 12px;
            color: #a7a7a7;
            margin-top: 2px;
        }

        .progress-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background-color: #4d4d4d;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background-color: #1ed760;
            border-radius: 2px;
            transition: width 0.1s linear;
        }

        .download-btn {
            background: none;
            border: none;
            color: #a7a7a7;
            font-size: 22px;
            cursor: pointer;
            padding: 5px;
            transition: color 0.2s;
        }

        .download-btn:hover { color: #1ed760; }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .player-controls button {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .player-controls button:active {
            transform: scale(0.9);
        }

        .player-controls .play-btn {
            background-color: white;
            color: black;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            font-size: 22px;
            padding-left: 4px; /* Center play icon */
        }

        .sec-btn {
            font-size: 12px !important;
            font-weight: 800;
            border: 1.5px solid #a7a7a7 !important;
            color: #a7a7a7 !important;
            border-radius: 50%;
            width: 32px;
            height: 32px;
        }

    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header-container">
        <div class="top-nav">
            <div class="avatar">J</div>
            <button class="nav-pill active">All</button>
            <button class="nav-pill">Music</button>
            <button class="nav-pill">Podcasts</button>
        </div>
        
        <div class="search-container">
            <div class="search-bar">
                <span>🔍</span>
                <input type="text" id="searchInput" placeholder="What do you want to listen to?" onkeyup="filterSongs()">
            </div>
        </div>
    </div>

    <!-- SECTION 1: JUMP BACK IN -->
    <h2>Jump back in</h2>
    <div class="horizontal-scroll">
        <div class="music-card" onclick="playSong(0)">
            <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300&h=300&fit=crop" alt="Song 1">
            <p class="title">Kesariya</p>
            <p class="subtitle">Album • Pritam</p>
        </div>

        <div class="music-card" onclick="playSong(1)">
            <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300&h=300&fit=crop" alt="Song 2">
            <p class="title">Dilbar Dilbar</p>
            <p class="subtitle">Playlist • Dhanda</p>
        </div>

        <div class="music-card" onclick="playSong(2)">
            <img src="https://images.unsplash.com/photo-1493225457124-a1a2a5f5646a?w=300&h=300&fit=crop" alt="Song 3">
            <p class="title">Top Chill Mix</p>
            <p class="subtitle">Made for You</p>
        </div>
    </div>

    <!-- SECTION 2: BEST OF THE WEEK -->
    <h2>Best of the Week</h2>
    <div class="horizontal-scroll">
        <div class="music-card" onclick="playSong(3)">
            <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300&h=300&fit=crop" alt="Song 4">
            <p class="title">Desi Bass</p>
            <p class="subtitle">Trending • Top 50</p>
        </div>

        <div class="music-card" onclick="playSong(4)">
            <img src="https://images.unsplash.com/photo-1459749411175-04bf5292ceea?w=300&h=300&fit=crop" alt="Song 5">
            <p class="title">Night Drive</p>
            <p class="subtitle">Chill • English</p>
        </div>

        <div class="music-card" onclick="playSong(5)">
            <img src="https://images.unsplash.com/photo-1516280440502-864aef97d661?w=300&h=300&fit=crop" alt="Song 6">
            <p class="title">Punjabi Pop</p>
            <p class="subtitle">Hits • New</p>
        </div>
    </div>

    <!-- BOTTOM PLAYER -->
    <div class="bottom-player">
        <div class="player-top">
            <div class="track-details">
                <h3 id="displayTitle">Select Song</h3>
                <p id="displayArtist">Music App</p>
            </div>
            <div class="progress-container">
                <span id="currTime" style="font-size: 11px; color: #a7a7a7;">0:00</span>
                <div class="progress-bar" onclick="seekAudio(event)">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span id="totalTime" style="font-size: 11px; color: #a7a7a7;">0:00</span>
            </div>
            <button class="download-btn" onclick="downloadSong()" title="Download">⬇️</button>
        </div>
        
        <div class="player-controls">
            <button class="sec-btn" onclick="skipTime(-10)">-10</button>
            <button onclick="prevSong()">⏮</button>
            <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
            <button onclick="nextSong()">⏭</button>
            <button class="sec-btn" onclick="skipTime(10)">+10</button>
        </div>
    </div>

    <!-- AUDIO TAG -->
    <audio id="audioPlayer" preload="auto"></audio>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // 100% Working Audio Links (Jo mobile aur background mein chalte hain)
        const songs = [
            { title: "Kesariya", artist: "Pritam", src: "https://pagalfree.com/musics/128-Kesariya%20-%20Brahmastra%20128%20Kbps.mp3" },
            { title: "Dilbar Dilbar", artist: "Neha Kakkar", src: "https://pagalfree.com/musics/128-Dilbar%20-%20Satyameva%20Jayate%20128%20Kbps.mp3" },
            { title: "Top Chill Mix", artist: "Made for You", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" },
            { title: "Desi Bass", artist: "Top 50", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" },
            { title: "Night Drive", artist: "Chill English", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3" },
            { title: "Punjabi Pop", artist: "New Hits", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3" }
        ];

        let currentSongIndex = 0;
        let isPlaying = false;

        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const progressFill = document.getElementById('progressFill');
        const displayTitle = document.getElementById('displayTitle');
        const displayArtist = document.getElementById('displayArtist');
        const currTime = document.getElementById('currTime');
        const totalTime = document.getElementById('totalTime');

        // Gaana Play karne ka function
        function playSong(index) {
            currentSongIndex = index;
            audio.src = songs[index].src;
            displayTitle.innerText = songs[index].title;
            displayArtist.innerText = songs[index].artist;
            
            audio.play().then(() => {
                isPlaying = true;
                playBtn.innerHTML = "⏸";
            }).catch(error => {
                // Agar koi error aaye (jaise direct play block ho), toh play button state update karein
                isPlaying = false;
                playBtn.innerHTML = "▶";
                console.log("Play error:", error);
            });
        }

        // Play/Pause Toggle
        function togglePlay() {
            if (audio.src === "") {
                playSong(0); // Agar kuch select nahi hai toh pehla gaana chalao
                return;
            }
            
            if (isPlaying) {
                audio.pause();
                playBtn.innerHTML = "▶";
            } else {
                audio.play();
                playBtn.innerHTML = "⏸";
            }
            isPlaying = !isPlaying;
        }

        // Next Song
        function nextSong() {
            currentSongIndex++;
            if (currentSongIndex >= songs.length) currentSongIndex = 0;
            playSong(currentSongIndex);
        }

        // Previous Song
        function prevSong() {
            currentSongIndex--;
            if (currentSongIndex < 0) currentSongIndex = songs.length - 1;
            playSong(currentSongIndex);
        }

        // 10 Sec Forward/Backward
        function skipTime(seconds) {
            if(audio.src !== "") {
                audio.currentTime += seconds;
            }
        }

        // Download Function
        function downloadSong() {
            if(audio.src === "") {
                alert("Pehle koi gaana select karein!");
                return;
            }
            window.open(audio.src, '_blank');
        }

        // Progress bar update
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = percent + "%";

                let currMins = Math.floor(audio.currentTime / 60);
                let currSecs = Math.floor(audio.currentTime % 60);
                currTime.innerText = `${currMins}:${currSecs < 10 ? '0' : ''}${currSecs}`;
            }
        });

        // Total duration aane par show karna
        audio.addEventListener('loadedmetadata', () => {
            let totalMins = Math.floor(audio.duration / 60);
            let totalSecs = Math.floor(audio.duration % 60);
            totalTime.innerText = `${totalMins}:${totalSecs < 10 ? '0' : ''}${totalSecs}`;
        });

        // Gaana khatam hone par automatically next chalao
        audio.addEventListener('ended', () => {
            nextSong();
        });

        // Progress bar par click karke aage/peeche karna
        function seekAudio(e) {
            if(!audio.duration) return;
            const width = e.currentTarget.clientWidth;
            const clickX = e.offsetX;
            audio.currentTime = (clickX / width) * audio.duration;
        }

        // SEARCH FUNCTION
        function filterSongs() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.music-card');

            cards.forEach(card => {
                const title = card.querySelector('.title').innerText.toLowerCase();
                if (title.includes(input)) {
                    card.style.display = "block"; 
                } else {
                    card.style.display = "none";
                }
            });
        }
    </script>
</body>
</html>
