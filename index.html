<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARMA PLAY</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===== TOP BAR + LOGO + SEARCH ===== -->
    <header class="topbar">
        <div class="logo">
            <div class="logo-icon">🎵</div>
            <h1>ARMA PLAY</h1>
        </div>

        <input type="text" id="searchInput" placeholder="गाने का नाम सर्च करें...">
    </header>

    <!-- ===== SEARCH RESULTS ===== -->
    <main class="results-container">
        <p id="statusMsg"></p>
        <ul id="songList"></ul>
    </main>

    <!-- ===== BOTTOM PLAYER BAR ===== -->
    <footer class="player-bar">

        <!-- Song Info -->
        <div class="now-playing">
            <img id="coverArt" src="" alt="">
            <div class="np-text">
                <p id="songTitle">कोई गाना नहीं चला</p>
                <p id="artistName"></p>
            </div>
            <a id="downloadBtn" href="#" download title="Download">⬇</a>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button id="prevBtn" title="Previous">⏮</button>
            <button id="playPauseBtn" title="Play/Pause">▶</button>
            <button id="nextBtn" title="Next">⏭</button>
        </div>

        <!-- Progress -->
        <div class="progress">
            <span id="currentTime">0:00</span>
            <input type="range" id="seekBar" value="0" min="0" max="100">
            <span id="duration">0:00</span>
        </div>

        <audio id="audioPlayer"></audio>
    </footer>

    <script src="script.js"></script>
</body>
</html>
