<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music App</title>
    <style>
        /* =========================================
           1. GLOBAL SETTINGS
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            padding-bottom: 120px; /* Player ke liye jagah */
            overflow-x: hidden;
        }

        h2 {
            font-size: 22px;
            margin: 25px 20px 15px 20px;
            letter-spacing: -0.5px;
        }

        /* =========================================
           2. TOP NAVIGATION & SEARCH
           ========================================= */
        .header-container {
            position: sticky;
            top: 0;
            background-color: #121212;
            z-index: 100;
            padding-bottom: 10px;
        }

        .top-nav {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 20px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            background-color: #ff7b9c;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .nav-pill {
            background-color: #2a2a2a;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 30px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .nav-pill.active {
            background-color: #1ed760;
            color: #000000;
        }

        /* NAYA: Search Bar */
        .search-container {
            padding: 0 20px;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 10px 15px;
        }

        .search-bar input {
            background: none;
            border: none;
            color: white;
            width: 100%;
            margin-left: 10px;
            font-size: 16px;
            outline: none;
        }

        .search-bar input::placeholder {
            color: #a7a7a7;
        }

        /* =========================================
           3. GRIDS & CARDS
           ========================================= */
        .recent-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 0 20px;
            margin-top: 15px;
        }

        .recent-item {
            display: flex;
            align-items: center;
            background-color: #2a2a2a;
            border-radius: 6px;
            overflow: hidden;
            height: 60px;
            cursor: pointer;
        }

        .recent-item img {
            width: 60px;
            height: 60px;
            object-fit: cover;
        }

        .recent-item span {
            font-size: 13px;
            font-weight: 700;
            padding: 0 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .horizontal-scroll {
            display: flex;
            overflow-x: auto;
            gap: 16px;
            padding: 0 20px 20px 20px;
        }

        .horizontal-scroll::-webkit-scrollbar {
            display: none;
        }

        .music-card {
            min-width: 140px;
            max-width: 140px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
        }

        .music-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 6px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .music-card .title {
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .music-card .subtitle {
            font-size: 13px;
            color: #a7a7a7;
        }

        /* =========================================
           4. BOTTOM PLAYER (Fixed)
           ========================================= */
        .bottom-player {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #181818;
            border-top: 1px solid #282828;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .track-details {
            width: 60px; /* Text fix karne ke liye */
        }

        .player-info h3 {
            font-size: 15px;
            margin-bottom: 4px;
            white-space: nowrap;
        }

        .player-info p {
            font-size: 12px;
            color: #a7a7a7;
        }

        .progress-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background-color: #4d4d4d;
            border-radius: 2px;
            position: relative;
            cursor: pointer;
        }

        .progress-bar .fill {
            width: 30%;
            height: 100%;
            background-color: #ffffff;
            border-radius: 2px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }

        /* NAYA: Buttons ko clean banaya gaya hai */
        .player-controls button {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .player-controls button:active {
            transform: scale(0.9);
        }

        .player-controls .play-btn {
            background-color: white;
            color: black;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 20px;
            padding-left: 3px;
        }
    </style>
</head>
<body>

    <!-- HEADER (Nav + Search) -->
    <div class="header-container">
        <div class="top-nav">
            <div class="avatar">J</div>
            <button class="nav-pill active">All</button>
            <button class="nav-pill">Music</button>
            <button class="nav-pill">Podcasts</button>
        </div>
        
        <!-- SEARCH BAR YAHAN HAI -->
        <div class="search-container">
            <div class="search-bar">
                <span>🔍</span>
                <input type="text" placeholder="What do you want to listen to?">
            </div>
        </div>
    </div>

    <!-- RECENT GRID -->
    <div class="recent-grid">
        <div class="recent-item">
            <img src="https://picsum.photos/100?random=1" alt="Masoom">
            <span>Masoom Sharma</span>
        </div>
        <div class="recent-item">
            <img src="https://picsum.photos/100?random=2" alt="Ramaiya">
            <span>Ramaiya Vastavaiya</span>
        </div>
        <div class="recent-item">
            <img src="https://picsum.photos/100?random=3" alt="Atif">
            <span>Atif Aslam Radio</span>
        </div>
        <div class="recent-item">
            <img src="https://picsum.photos/100?random=4" alt="Filmy">
            <span>Filmy Hangover</span>
        </div>
    </div>

    <!-- JUMP BACK IN -->
    <h2>Jump back in</h2>
    <div class="horizontal-scroll">
        <div class="music-card">
            <img src="https://picsum.photos/300?random=5" alt="Mumbai">
            <p class="title">Once Upon A Time</p>
            <p class="subtitle">Album • Pritam</p>
        </div>
        <div class="music-card">
            <img src="https://picsum.photos/300?random=6" alt="Karan">
            <p class="title">Karan Aujla</p>
            <p class="subtitle">Playlist • Dhanda</p>
        </div>
        <div class="music-card">
            <img src="https://picsum.photos/300?random=7" alt="Mix">
            <p class="title">Your Top Mix</p>
            <p class="subtitle">Made for You</p>
        </div>
    </div>

    <!-- BOTTOM PLAYER -->
    <div class="bottom-player">
        <div class="player-info">
            <div class="track-details">
                <h3>Track Name</h3>
                <p>ARMA PLAY</p>
            </div>
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="fill"></div>
                </div>
            </div>
        </div>
        <div class="player-controls">
            <!-- Naye buttons with JavaScript actions -->
            <button onclick="prevSong()">⏮</button>
            <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
            <button onclick="nextSong()">⏭</button>
        </div>
    </div>

    <!-- JAVASCRIPT (Buttons ko kaam karwane ke liye) -->
    <script>
        let isPlaying = false;

        function togglePlay() {
            const playBtn = document.getElementById('playBtn');
            isPlaying = !isPlaying; // True ko False, False ko True karega
            
            if (isPlaying) {
                playBtn.innerHTML = "⏸"; // Pause icon
                // Yahan aap apna asli audio play karne ka code likh sakte hain
            } else {
                playBtn.innerHTML = "▶"; // Play icon
                // Yahan aap apna asli audio pause karne ka code likh sakte hain
            }
        }

        function nextSong() {
            alert("Next song playing..."); // Abhi ke liye alert dikhega
            // Yahan next song ka logic aayega
        }

        function prevSong() {
            alert("Previous song playing...");
            // Yahan previous song ka logic aayega
        }
    </script>
</body>
</html>
