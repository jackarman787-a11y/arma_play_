<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<title>ARMA PLAY — Music Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --accent:#d8ad55;
  --accent-2:#ff6b6b;
  --bg:#0a0a0a;
  --bg-2:#121212;
  --bg-3:#1a1a1a;
  --text:#fff;
  --muted:#a0a0a0;
  --border:#2a2a2a;
}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  padding-bottom:140px;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse at top left,rgba(216,173,85,.12),transparent 50%),
    radial-gradient(ellipse at bottom right,rgba(255,107,107,.08),transparent 50%);
  pointer-events:none;
  z-index:0;
}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#333;border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}

/* HEADER */
header{
  position:sticky;top:0;z-index:50;
  padding:20px 18px 14px;
  display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(180deg,rgba(10,10,10,.95),rgba(10,10,10,.7),transparent);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}
.logo{
  font-size:24px;font-weight:900;letter-spacing:3px;
  background:linear-gradient(135deg,var(--accent) 0%,#f0d78c 50%,var(--accent) 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shine 3s ease-in-out infinite;
}
@keyframes shine{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}
.logo span{
  -webkit-text-fill-color:#fff;color:#fff;
  font-weight:400;
}
.tag{
  color:var(--muted);font-size:10px;letter-spacing:2px;
  font-weight:600;text-transform:uppercase;
  display:flex;align-items:center;gap:6px;
}
.tag::before{
  content:'';width:6px;height:6px;border-radius:50%;
  background:#4ade80;box-shadow:0 0 8px #4ade80;
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* SEARCH */
.search-wrap{
  margin:8px 16px 20px;
  position:relative;z-index:10;
}
.search{
  display:flex;
  background:rgba(32,32,32,.9);
  border:1px solid var(--border);
  border-radius:16px;
  padding:5px;
  transition:all .3s;
  backdrop-filter:blur(10px);
}
.search:focus-within{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(216,173,85,.15);
  background:rgba(40,40,40,.95);
}
.search .icon{
  display:flex;align-items:center;justify-content:center;
  padding:0 12px;color:var(--muted);font-size:16px;
}
.search input{
  background:none;border:0;outline:none;color:var(--text);
  padding:14px 4px;width:100%;font-size:15px;font-family:inherit;
  font-weight:500;
}
.search input::placeholder{color:#666}
.search button{
  background:linear-gradient(135deg,var(--accent),#e8c876);
  border:0;border-radius:12px;padding:0 20px;
  font-weight:700;font-size:12px;letter-spacing:1px;
  color:#000;cursor:pointer;font-family:inherit;
  transition:all .2s;min-width:90px;
}
.search button:hover{transform:scale(1.03);box-shadow:0 4px 16px rgba(216,173,85,.4)}
.search button:active{transform:scale(.97)}

/* SECTIONS */
.section-title{
  display:flex;justify-content:space-between;align-items:center;
  margin:22px 18px 14px;
}
.section-title h2{
  font-size:19px;font-weight:800;letter-spacing:-.3px;
}
.section-title .clear{
  background:none;border:0;color:var(--accent);
  font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;
}

/* CHIPS */
.chips{
  display:flex;gap:8px;overflow-x:auto;
  padding:0 16px 12px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;
  background:var(--bg-3);
  border:1px solid var(--border);
  border-radius:100px;
  padding:9px 16px;
  font-size:13px;font-weight:600;
  color:var(--text);cursor:pointer;
  transition:all .2s;font-family:inherit;
}
.chip:hover,.chip.active{
  background:var(--accent);color:#000;
  border-color:var(--accent);
}

/* STATUS */
#status{
  margin:15px 18px;color:var(--muted);font-size:13px;
  text-align:center;padding:16px 0;
  transition:opacity .3s;
}

/* RESULTS */
#results{padding:0 12px;position:relative;z-index:1}
.song{
  display:flex;align-items:center;gap:13px;
  padding:10px 8px;border-radius:14px;
  transition:all .2s;cursor:pointer;
  position:relative;
}
.song:hover{background:rgba(255,255,255,.04);transform:translateX(2px)}
.song:active{background:rgba(255,255,255,.08);transform:scale(.99)}
.song.playing{background:rgba(216,173,85,.08)}
.song.playing::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:60%;background:var(--accent);border-radius:0 3px 3px 0;
}
.song .img-wrap{
  position:relative;flex-shrink:0;
  width:57px;height:57px;border-radius:10px;overflow:hidden;
  background:var(--bg-3);
  box-shadow:0 4px 12px rgba(0,0,0,.4);
}
.song img{
  width:100%;height:100%;object-fit:cover;
  transition:transform .3s;
}
.song:hover img{transform:scale(1.08)}
.song .img-wrap::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,transparent 60%,rgba(0,0,0,.3));
  pointer-events:none;
}
.info{flex:1;min-width:0}
.info b{
  display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-size:14px;font-weight:600;margin-bottom:4px;
}
.info small{
  display:block;color:var(--muted);
  font-size:12px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.play-btn{
  background:rgba(216,173,85,.15);
  border:0;color:var(--accent);
  width:40px;height:40px;border-radius:50%;
  font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;flex-shrink:0;
}
.play-btn:hover{
  background:var(--accent);color:#000;
  transform:scale(1.1);
}
.song.playing .play-btn{
  background:var(--accent);color:#000;
  animation:glow 1.5s infinite;
}
@keyframes glow{
  0%,100%{box-shadow:0 0 0 0 rgba(216,173,85,.5)}
  50%{box-shadow:0 0 0 8px rgba(216,173,85,0)}
}

/* SKELETON */
.skeleton{
  display:flex;gap:13px;padding:10px 8px;align-items:center;
}
.sk-img{
  width:57px;height:57px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(90deg,#1a1a1a,#2a2a2a,#1a1a1a);
  background-size:200% 100%;animation:shimmer 1.5s infinite;
}
.sk-lines{flex:1;display:flex;flex-direction:column;gap:8px}
.sk-line{
  height:12px;border-radius:6px;
  background:linear-gradient(90deg,#1a1a1a,#2a2a2a,#1a1a1a);
  background-size:200% 100%;animation:shimmer 1.5s infinite;
}
.sk-line.short{width:40%}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* PLAYER */
.player{
  position:fixed;bottom:0;left:0;width:100%;z-index:100;
  background:rgba(15,15,15,.92);
  backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  border-top:1px solid rgba(255,255,255,.08);
  padding:10px 16px 14px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom));
  transition:transform .4s cubic-bezier(.4,0,.2,1);
}
.player::before{
  content:'';position:absolute;top:-1px;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  opacity:.6;
}
.now{
  display:flex;align-items:center;gap:12px;margin-bottom:10px;
}
.now .cover-wrap{
  position:relative;flex-shrink:0;
  width:48px;height:48px;border-radius:10px;overflow:hidden;
  background:var(--bg-3);
  box-shadow:0 6px 20px rgba(0,0,0,.5);
}
.now .cover-wrap.spinning img{
  animation:spin 8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.now img{width:100%;height:100%;object-fit:cover}
.nowinfo{flex:1;min-width:0}
.nowinfo b{
  display:block;font-size:14px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-bottom:3px;
}
.nowinfo small{
  display:block;color:var(--muted);font-size:12px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.open{
  color:var(--accent);text-decoration:none;
  font-size:11px;font-weight:700;white-space:nowrap;
  padding:6px 10px;border-radius:8px;
  background:rgba(216,173,85,.1);
  transition:all .2s;
}
.open:hover{background:rgba(216,173,85,.2);transform:translateY(-1px)}

/* PROGRESS */
.progress-wrap{
  position:relative;height:18px;
  display:flex;align-items:center;margin-bottom:2px;
  cursor:pointer;touch-action:none;
}
.progress-bg{
  position:absolute;left:0;right:0;height:4px;
  background:rgba(255,255,255,.15);border-radius:10px;
  overflow:hidden;
}
.progress-fill{
  position:absolute;left:0;top:0;bottom:0;width:0%;
  background:linear-gradient(90deg,var(--accent),#f0d78c);
  border-radius:10px;transition:width .1s linear;
}
.progress-thumb{
  position:absolute;top:50%;left:0;
  width:12px;height:12px;border-radius:50%;
  background:#fff;
  transform:translate(-50%,-50%);
  box-shadow:0 2px 8px rgba(0,0,0,.6);
  opacity:0;transition:opacity .2s;
  pointer-events:none;
}
.progress-wrap:hover .progress-thumb{opacity:1}
.time{
  display:flex;justify-content:space-between;
  color:var(--muted);font-size:10px;font-weight:500;
  margin-bottom:10px;
  font-variant-numeric:tabular-nums;
}

/* CONTROLS */
.controls{
  display:flex;align-items:center;justify-content:center;gap:24px;
}
.controls button{
  background:none;border:0;color:#fff;
  font-size:20px;cursor:pointer;
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;font-family:inherit;
  position:relative;
}
.controls button:hover{background:rgba(255,255,255,.08);transform:scale(1.1)}
.controls button:active{transform:scale(.9)}
.controls button.active{color:var(--accent)}
.controls .main{
  width:54px;height:54px;
  background:linear-gradient(135deg,var(--accent),#e8c876);
  color:#000;
  font-size:22px;
  box-shadow:0 6px 20px rgba(216,173,85,.4);
}
.controls .main:hover{
  transform:scale(1.08);
  box-shadow:0 8px 28px rgba(216,173,85,.6);
}
.controls .main:active{transform:scale(.95)}
.controls .main.loading{pointer-events:none}
.controls .main.loading::after{
  content:'';position:absolute;inset:-2px;
  border:2px solid transparent;border-top-color:#000;
  border-radius:50%;animation:spin .8s linear infinite;
}

/* VOLUME */
.volume{
  display:none;align-items:center;gap:8px;
  margin-top:10px;padding:0 20px;
}
.volume input{
  flex:1;accent-color:var(--accent);
  height:3px;
}

/* BOTTOM SHEET (FULL PLAYER) */
.sheet{
  position:fixed;inset:0;z-index:200;
  background:linear-gradient(180deg,var(--bg-2),var(--bg));
  transform:translateY(100%);
  transition:transform .5s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
  padding:16px;overflow-y:auto;
}
.sheet.open{transform:translateY(0)}
.sheet-close{
  background:none;border:0;color:#fff;
  font-size:26px;cursor:pointer;
  align-self:center;padding:10px;
  font-family:inherit;
}
.sheet-art{
  width:min(80vw,320px);height:min(80vw,320px);
  margin:20px auto;border-radius:24px;
  object-fit:cover;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
  background:var(--bg-3);
}
.sheet-info{text-align:center;margin:16px 20px}
.sheet-info h3{font-size:22px;font-weight:800;margin-bottom:6px}
.sheet-info p{color:var(--muted);font-size:14px}

/* TOAST */
.toast{
  position:fixed;bottom:160px;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(30,30,30,.95);backdrop-filter:blur(20px);
  border:1px solid var(--border);
  color:#fff;padding:12px 20px;border-radius:12px;
  font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;
  transition:all .3s;z-index:500;
  max-width:90%;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* EMPTY */
.empty{
  text-align:center;padding:50px 20px;color:var(--muted);
}
.empty .emoji{font-size:48px;margin-bottom:16px;display:block;opacity:.5}
.empty p{font-size:14px;margin-bottom:6px}
.empty small{font-size:12px;opacity:.7}

@media(min-width:720px){
  .player{max-width:500px;left:50%;transform:translateX(-50%);border-radius:20px 20px 0 0;border:1px solid var(--border);border-bottom:0}
  #results{max-width:700px;margin:0 auto}
  .search-wrap{max-width:700px;margin-left:auto;margin-right:auto}
  .chips{max-width:700px;margin:0 auto}
  .section-title{max-width:700px;margin-left:auto;margin-right:auto}
  .volume{display:flex}
  .now .cover-wrap{cursor:pointer}
}
</style>
</head>
<body>

<header>
  <div class="logo">ARMA <span>PLAY</span></div>
  <div class="tag">LIVE</div>
</header>

<div class="search-wrap">
  <div class="search">
    <div class="icon">🔍</div>
    <input id="query" placeholder="Songs, artists, albums..." autocomplete="off">
    <button onclick="searchSongs()">SEARCH</button>
  </div>
</div>

<div class="chips" id="chips"></div>

<div class="section-title">
  <h2 id="sectionTitle">🔥 Trending Now</h2>
  <button class="clear" id="clearBtn" style="display:none" onclick="clearResults()">Clear</button>
</div>

<div id="status">Search your favourite songs to get started.</div>
<div id="results"></div>

<!-- MAIN PLAYER -->
<div class="player" id="player">
  <div class="now">
    <div class="cover-wrap" onclick="openSheet()">
      <img id="cover" src="https://placehold.co/100x100/1a1a1a/d8ad55?text=♪">
    </div>
    <div class="nowinfo">
      <b id="title">Select a song</b>
      <small id="artist">ARMA PLAY</small>
    </div>
    <a id="fullSong" class="open" href="#" target="_blank" style="display:none">FULL ↗</a>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bg"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-thumb" id="progressThumb"></div>
  </div>
  <div class="time">
    <span id="currentTime">0:00</span>
    <span id="duration">0:00</span>
  </div>

  <div class="controls">
    <button id="shuffleBtn" onclick="toggleShuffle()" title="Shuffle">🔀</button>
    <button onclick="previousSong()" title="Previous">⏮</button>
    <button class="main" id="toggle" onclick="togglePlay()">▶</button>
    <button onclick="nextSong()" title="Next">⏭</button>
    <button id="repeatBtn" onclick="toggleRepeat()" title="Repeat">🔁</button>
  </div>

  <div class="volume">
    <span>🔊</span>
    <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
  </div>
</div>

<!-- FULL SHEET -->
<div class="sheet" id="sheet">
  <button class="sheet-close" onclick="closeSheet()">⌄</button>
  <img class="sheet-art" id="sheetArt" src="https://placehold.co/400x400/1a1a1a/d8ad55?text=♪">
  <div class="sheet-info">
    <h3 id="sheetTitle">Select a song</h3>
    <p id="sheetArtist">ARMA PLAY</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<audio id="audio" preload="metadata"></audio>
<script src="script.js"></script>
</body>
</html>
