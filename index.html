<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>ARMA PLAY</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <!-- Top Nav -->
  <header class="top-nav">
    <div class="user-pill">J</div>
    <div class="chips">
      <span class="chip active">All</span>
      <span class="chip">Music</span>
      <span class="chip">Podcasts</span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="content">
    
    <!-- Quick Grid (Small Cards) -->
    <div class="quick-grid">
      <div class="quick-card">
        <div class="q-img" style="background:#a855f7;">🎵</div>
        <div class="q-title">Daily Mix 1</div>
      </div>
      <div class="quick-card">
        <div class="q-img" style="background:#ef4444;">🎸</div>
        <div class="q-title">Rock Hits</div>
      </div>
      <div class="quick-card">
        <div class="q-img" style="background:#3b82f6;">🎧</div>
        <div class="q-title">Chill Vibes</div>
      </div>
      <div class="quick-card">
        <div class="q-img" style="background:#10b981;">🔥</div>
        <div class="q-title">Trending</div>
      </div>
    </div>

    <!-- Jump Back In (Large Horizontal) -->
    <h2 class="section-title">Jump back in</h2>
    <div class="h-scroll">
      <div class="large-card">
        <div class="l-img" style="background:linear-gradient(45deg,#ff2d95,#7a5cff)">🎵</div>
        <div class="l-title">ARMA PLAY</div>
        <div class="l-sub">Playlist</div>
      </div>
      <div class="large-card">
        <div class="l-img" style="background:linear-gradient(45deg,#11998e,#38ef7d)">🎸</div>
        <div class="l-title">Indie Mix</div>
        <div class="l-sub">Playlist</div>
      </div>
    </div>

    <!-- All Songs List -->
    <h2 class="section-title" style="margin-top:24px;">Your Tracks</h2>
    <div class="track-list" id="homeTrackList"></div>
    
    <!-- Add Music -->
    <button class="btn-add" onclick="document.getElementById('file').click()">+ Add Music</button>
    <input type="file" id="file" multiple accept="audio/*" style="display:none">

  </main>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <div class="nav-item active">
      <span class="icon">🏠</span> Home
    </div>
    <div class="nav-item">
      <span class="icon">🔍</span> Search
    </div>
    <div class="nav-item">
      <span class="icon">📚</span> Your Library
    </div>
  </nav>
</div>

<!-- Mini Player (Bottom) -->
<div class="mini-player" id="miniPlayer" style="display:none;">
  <div class="mini-left" onclick="document.getElementById('fullscreen').classList.add('show')">
    <div class="mini-img">🎵</div>
    <div class="mini-info">
      <div class="mini-title" id="npTitle">Track Name</div>
      <div class="mini-artist">ARMA PLAY</div>
    </div>
  </div>
  <div class="mini-controls">
    <button class="icon-btn" onclick="togglePlay()" id="playBtn">▶</button>
  </div>
</div>

<!-- Fullscreen Player -->
<div class="fullscreen" id="fullscreen">
  <div class="fs-header">
    <button class="icon-btn" onclick="document.getElementById('fullscreen').classList.remove('show')">▼</button>
    <span>Now Playing</span>
    <button class="icon-btn">⋯</button>
  </div>
  
  <div class="fs-cover" id="fsCover">🎵</div>
  
  <div class="fs-details">
    <h1 class="fs-title" id="fsTitle">Track Name</h1>
    <div class="fs-artist">ARMA PLAY</div>
  </div>

  <div class="fs-progress">
    <input type="range" id="seek" value="0" max="100" step="0.1">
    <div class="fs-times"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
  </div>

  <div class="fs-controls">
    <button class="icon-btn" id="shuffleBtn">🔀</button>
    <button class="icon-btn" onclick="prev()">⏮</button>
    <button class="play-btn-lg" onclick="togglePlay()" id="fsPlayBtn">▶</button>
    <button class="icon-btn" onclick="next()">⏭</button>
    <button class="icon-btn" id="repeatBtn">🔁</button>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>
<script src="script.js"></script>
</body>
</html>
