<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Working Music App</title>
    <style>
        /* =========================================
           GLOBAL DESIGN
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            padding-bottom: 120px; /* Space for player */
        }

        h2 {
            font-size: 22px;
            margin: 25px 20px 15px 20px;
        }

        /* =========================================
           HEADER & SEARCH
           ========================================= */
        .header-container {
            position: sticky;
            top: 0;
            background-color: #121212;
            z-index: 100;
            padding-bottom: 10px;
        }

        .top-nav {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 20px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            background-color: #ff7b9c;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: bold;
        }

        .nav-pill {
            background-color: #2a2a2a;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 30px;
            border: none;
            font-size: 14px;
            font-weight: 600;
        }

        .nav-pill.active {
            background-color: #1ed760;
            color: #000000;
        }

        .search-container {
            padding: 0 20px;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 10px 15px;
        }

        .search-bar input {
            background: none;
            border: none;
            color: white;
            width: 100%;
            margin-left: 10px;
            font-size: 16px;
            outline: none;
        }

        /* =========================================
           CARDS & GRID
           ========================================= */
        .recent-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 0 20px;
        }

        .recent-item {
            display: flex;
            align-items: center;
            background-color: #2a2a2a;
            border-radius: 6px;
            height: 60px;
            cursor: pointer;
            overflow: hidden;
        }

        .recent-item img {
            width: 60px;
            height: 60px;
            object-fit: cover;
        }

        .recent-item span {
            font-size: 13px;
            font-weight: 700;
            padding: 0 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .horizontal-scroll {
            display: flex;
            overflow-x: auto;
            gap: 16px;
            padding: 0 20px 20px 20px;
        }

        .horizontal-scroll::-webkit-scrollbar { display: none; }

        .music-card {
            min-width: 140px;
            max-width: 140px;
            cursor: pointer;
        }

        .music-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 6px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .music-card .title {
            font-size: 15px;
            font-weight: 700;
            margin-top: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .music-card .subtitle {
            font-size: 13px;
            color: #a7a7a7;
        }

        /* =========================================
           BOTTOM PLAYER
           ========================================= */
        .bottom-player {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: #181818;
            border-top: 1px solid #282828;
            padding: 15px 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .player-top {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .track-details {
            width: 80px;
        }

        .track-details h3 {
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-details p {
            font-size: 12px;
            color: #a7a7a7;
        }

        .progress-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background-color: #4d4d4d;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background-color: #1ed760;
            border-radius: 2px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }

        .player-controls button {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .player-controls .play-btn {
            background-color: white;
            color: black;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header-container">
        <div class="top-nav">
            <div class="avatar">J</div>
            <button class="nav-pill active">All</button>
            <button class="nav-pill">Music</button>
            <button class="nav-pill">Podcasts</button>
        </div>
        
        <!-- SEARCH BAR (Ab yeh kaam karega) -->
        <div class="search-container">
            <div class="search-bar">
                <span>🔍</span>
                <input type="text" id="searchInput" placeholder="Search songs..." onkeyup="filterSongs()">
            </div>
        </div>
    </div>

    <!-- CARDS SECTION -->
    <h2>Jump back in</h2>
    <div class="horizontal-scroll" id="songList">
        
        <!-- Card 1 -->
        <div class="music-card" onclick="playSong(0)">
            <img src="https://picsum.photos/300?random=5" alt="Song 1">
            <p class="title">Mumbai Beat</p>
            <p class="subtitle">Album • Pritam</p>
        </div>

        <!-- Card 2 -->
        <div class="music-card" onclick="playSong(1)">
            <img src="https://picsum.photos/300?random=6" alt="Song 2">
            <p class="title">Karan Aujla Hit</p>
            <p class="subtitle">Playlist • Dhanda</p>
        </div>

        <!-- Card 3 -->
        <div class="music-card" onclick="playSong(2)">
            <img src="https://picsum.photos/300?random=7" alt="Song 3">
            <p class="title">Top Chill Mix</p>
            <p class="subtitle">Made for You</p>
        </div>

    </div>

    <!-- BOTTOM PLAYER -->
    <div class="bottom-player">
        <div class="player-top">
            <div class="track-details">
                <h3 id="displayTitle">No Song</h3>
                <p id="displayArtist">Select a track</p>
            </div>
            <div class="progress-container">
                <span id="currTime" style="font-size: 10px; color: #a7a7a7;">0:00</span>
                <div class="progress-bar" onclick="seekAudio(event)">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span id="totalTime" style="font-size: 10px; color: #a7a7a7;">0:00</span>
            </div>
        </div>
        
        <div class="player-controls">
            <button onclick="prevSong()">⏮</button>
            <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
            <button onclick="nextSong()">⏭</button>
        </div>
    </div>

    <!-- AUDIO TAG (Yahan gaana bajega) -->
    <audio id="audioPlayer"></audio>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // 3 Free Online MP3 Songs (Testing ke liye)
        const songs = [
            { title: "Mumbai Beat", artist: "Pritam", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
            { title: "Karan Aujla Hit", artist: "Dhanda", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
            { title: "Top Chill Mix", artist: "Made for You", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" }
        ];

        let currentSongIndex = 0;
        let isPlaying = false;

        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const progressFill = document.getElementById('progressFill');
        const displayTitle = document.getElementById('displayTitle');
        const displayArtist = document.getElementById('displayArtist');
        const currTime = document.getElementById('currTime');
        const totalTime = document.getElementById('totalTime');

        // Gaana Play karne ka function
        function playSong(index) {
            currentSongIndex = index;
            audio.src = songs[index].src;
            displayTitle.innerText = songs[index].title;
            displayArtist.innerText = songs[index].artist;
            
            audio.play();
            isPlaying = true;
            playBtn.innerHTML = "⏸"; // Pause icon
        }

        // Play/Pause Toggle
        function togglePlay() {
            if (audio.src === "") {
                playSong(0); // Agar kuch select nahi hai toh pehla gaana chalao
                return;
            }
            
            if (isPlaying) {
                audio.pause();
                playBtn.innerHTML = "▶";
            } else {
                audio.play();
                playBtn.innerHTML = "⏸";
            }
            isPlaying = !isPlaying;
        }

        // Next Song
        function nextSong() {
            currentSongIndex++;
            if (currentSongIndex >= songs.length) currentSongIndex = 0; // Wapas pehle par
            playSong(currentSongIndex);
        }

        // Previous Song
        function prevSong() {
            currentSongIndex--;
            if (currentSongIndex < 0) currentSongIndex = songs.length - 1; // Aakhri gaane par
            playSong(currentSongIndex);
        }

        // Progress bar update karna
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = percent + "%";

                // Time format (0:00)
                let currMins = Math.floor(audio.currentTime / 60);
                let currSecs = Math.floor(audio.currentTime % 60);
                currTime.innerText = `${currMins}:${currSecs < 10 ? '0' : ''}${currSecs}`;
            }
        });

        // Total duration aane par show karna
        audio.addEventListener('loadedmetadata', () => {
            let totalMins = Math.floor(audio.duration / 60);
            let totalSecs = Math.floor(audio.duration % 60);
            totalTime.innerText = `${totalMins}:${totalSecs < 10 ? '0' : ''}${totalSecs}`;
        });

        // Progress bar par click karke aage/peeche karna
        function seekAudio(e) {
            const width = e.currentTarget.clientWidth;
            const clickX = e.offsetX;
            audio.currentTime = (clickX / width) * audio.duration;
        }

        // SEARCH FUNCTION
        function filterSongs() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.music-card');

            cards.forEach(card => {
                const title = card.querySelector('.title').innerText.toLowerCase();
                if (title.includes(input)) {
                    card.style.display = "flex";
                } else {
                    card.style.display = "none";
                }
            });
        }
    </script>
</body>
</html>
