<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music App</title>
    <style>
        /* =========================================
           1. GLOBAL SETTINGS (Background & Fonts)
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #121212; /* Spotify Dark Background */
            color: #ffffff;
            padding-bottom: 100px; /* Space for bottom player */
            overflow-x: hidden;
        }

        h2 {
            font-size: 22px;
            margin: 25px 20px 15px 20px;
            letter-spacing: -0.5px;
        }

        /* =========================================
           2. TOP NAVIGATION (Pills & Avatar)
           ========================================= */
        .top-nav {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 20px;
            background-color: #121212;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .avatar {
            width: 36px;
            height: 36px;
            background-color: #ff7b9c; /* Pink avatar */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .nav-pill {
            background-color: #2a2a2a;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 30px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .nav-pill.active {
            background-color: #1ed760; /* Spotify Green */
            color: #000000;
        }

        /* =========================================
           3. RECENTLY PLAYED GRID (Top Section)
           ========================================= */
        .recent-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* 2 Columns */
            gap: 12px;
            padding: 0 20px;
        }

        .recent-item {
            display: flex;
            align-items: center;
            background-color: #2a2a2a;
            border-radius: 6px;
            overflow: hidden;
            height: 60px;
            cursor: pointer;
        }

        .recent-item img {
            width: 60px;
            height: 60px;
            object-fit: cover;
        }

        .recent-item span {
            font-size: 13px;
            font-weight: 700;
            padding-left: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 10px;
        }

        /* =========================================
           4. JUMP BACK IN (Horizontal Cards)
           ========================================= */
        .horizontal-scroll {
            display: flex;
            overflow-x: auto;
            gap: 16px;
            padding: 0 20px 20px 20px;
            scroll-behavior: smooth;
        }

        /* Hide scrollbar for a cleaner look */
        .horizontal-scroll::-webkit-scrollbar {
            display: none;
        }

        .music-card {
            min-width: 140px;
            max-width: 140px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
            padding: 10px;
            border-radius: 8px;
        }

        .music-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 6px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .music-card .title {
            font-size: 15px;
            font-weight: 700;
            margin-top: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .music-card .subtitle {
            font-size: 13px;
            color: #a7a7a7;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* =========================================
           5. BOTTOM PLAYER (Fixed at bottom)
           ========================================= */
        .bottom-player {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #181818;
            border-top: 1px solid #282828;
            padding: 15px 20px 25px 20px;
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }

        .player-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .player-info h3 {
            font-size: 15px;
            margin-bottom: 4px;
        }

        .player-info p {
            font-size: 12px;
            color: #a7a7a7;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background-color: #4d4d4d;
            border-radius: 2px;
            margin: 8px 0;
            position: relative;
        }

        .progress-bar .fill {
            width: 30%;
            height: 100%;
            background-color: #ffffff;
            border-radius: 2px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
        }

        .player-controls button {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .player-controls .play-btn {
            background-color: white;
            color: black;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            padding-left: 4px; /* Center the play icon */
        }
    </style>
</head>
<body>

    <!-- 1. TOP NAVIGATION -->
    <div class="top-nav">
        <div class="avatar">J</div>
        <button class="nav-pill active">All</button>
        <button class="nav-pill">Music</button>
        <button class="nav-pill">Podcasts</button>
    </div>

    <!-- 2. RECENTLY PLAYED GRID -->
    <div class="recent-grid">
        <div class="recent-item">
            <!-- Yahan apni image ka link daalein -->
            <img src="https://picsum.photos/100?random=1" alt="Masoom Sharma">
            <span>Masoom Sharma Radio</span>
        </div>
        <div class="recent-item">
            <img src="https://picsum.photos/100?random=2" alt="Ramaiya">
            <span>Ramaiya Vastavaiya</span>
        </div>
        <div class="recent-item">
            <img src="https://picsum.photos/100?random=3" alt="Atif Aslam">
            <span>Atif Aslam Radio</span>
        </div>
        <div class="recent-item">
            <img src="https://picsum.photos/100?random=4" alt="Filmy Hangover">
            <span>Filmy Hangover</span>
        </div>
    </div>

    <!-- 3. JUMP BACK IN -->
    <h2>Jump back in</h2>
    <div class="horizontal-scroll">
        <div class="music-card">
            <img src="https://picsum.photos/300?random=5" alt="Once Upon A Time">
            <p class="title">Once Upon A Time In Mumbai</p>
            <p class="subtitle">Album • Pritam</p>
        </div>
        <div class="music-card">
            <img src="https://picsum.photos/300?random=6" alt="Karan Aujla">
            <p class="title">Karan Aujla</p>
            <p class="subtitle">Playlist • Dhanda</p>
        </div>
        <div class="music-card">
            <img src="https://picsum.photos/300?random=7" alt="Mix">
            <p class="title">Your Top Mix</p>
            <p class="subtitle">Made for You</p>
        </div>
    </div>

    <!-- 4. BOTTOM PLAYER -->
    <div class="bottom-player">
        <div class="player-info">
            <div>
                <h3>Track Name</h3>
                <p>ARMA PLAY</p>
            </div>
            <div class="progress-bar">
                <div class="fill"></div>
            </div>
        </div>
        <div class="player-controls">
            <button>⏮️</button>
            <button class="play-btn">▶️</button>
            <button>⏭️</button>
        </div>
    </div>

</body>
</html>
