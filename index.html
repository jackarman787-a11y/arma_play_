<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Online Music App</title>
    <style>
        /* =========================================
           GLOBAL STYLING
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            padding-bottom: 150px;
            overflow-x: hidden;
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            margin: 20px 20px 15px 20px;
        }

        /* =========================================
           HEADER & TABS
           ========================================= */
        .header-container {
            position: sticky;
            top: 0;
            background-color: #121212;
            z-index: 100;
            padding-bottom: 10px;
            border-bottom: 1px solid #282828;
        }

        .top-nav {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px 20px;
            overflow-x: auto;
        }
        .top-nav::-webkit-scrollbar { display: none; }

        .nav-pill {
            background-color: #2a2a2a;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 30px;
            border: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .nav-pill.active {
            background-color: #1ed760;
            color: #000000;
        }

        .search-container { padding: 0 20px; }

        .search-bar {
            display: flex;
            align-items: center;
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 10px 15px;
        }

        .search-bar input {
            background: none;
            border: none;
            color: white;
            width: 100%;
            margin-left: 10px;
            font-size: 16px;
            outline: none;
        }

        /* =========================================
           MUSIC CARDS
           ========================================= */
        .horizontal-scroll {
            display: flex;
            overflow-x: auto;
            gap: 16px;
            padding: 0 20px 20px 20px;
            flex-wrap: wrap; /* Search results ke liye wrap kiya */
        }

        .music-card {
            width: 140px;
            cursor: pointer;
            padding: 10px;
            border-radius: 8px;
            background-color: #181818;
            transition: background-color 0.3s;
        }

        .music-card:hover { background-color: #2a2a2a; }

        .music-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 6px;
        }

        .music-card .title {
            font-size: 14px;
            font-weight: 700;
            margin-top: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .music-card .subtitle {
            font-size: 12px;
            color: #a7a7a7;
            margin-top: 4px;
        }

        /* =========================================
           BOTTOM PLAYER
           ========================================= */
        .bottom-player {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: #181818;
            border-top: 1px solid #282828;
            padding: 15px 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .player-top {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
        }

        .track-details { width: 100px; }

        .track-details h3 {
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-details p {
            font-size: 12px;
            color: #a7a7a7;
        }

        .progress-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background-color: #4d4d4d;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background-color: #1ed760;
            border-radius: 2px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .player-controls button {
            background: none;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
        }

        .player-controls .play-btn {
            background-color: white;
            color: black;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-left: 3px;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header-container">
        <div class="top-nav">
            <button class="nav-pill active">Online Search</button>
        </div>
        
        <div class="search-container">
            <div class="search-bar">
                <span>🔍</span>
                <!-- Jab user type karega, to online API call hoga -->
                <input type="text" id="searchInput" placeholder="Search any song (e.g. Dilbar)..." onkeyup="searchOnlineSongs()">
            </div>
        </div>
    </div>

    <!-- MUSIC CARDS CONTAINER -->
    <h2 id="sectionTitle">Top Songs</h2>
    <div class="horizontal-scroll" id="songList">
        <!-- Loader text -->
        <p style="color: #a7a7a7;">Type in search bar to find songs...</p>
    </div>

    <!-- BOTTOM PLAYER -->
    <div class="bottom-player">
        <div class="player-top">
            <div class="track-details">
                <h3 id="displayTitle">Select Song</h3>
                <p id="displayArtist">Music App</p>
            </div>
            <div class="progress-container">
                <span id="currTime" style="font-size: 10px; color: #a7a7a7;">0:00</span>
                <div class="progress-bar" onclick="seekAudio(event)">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span id="totalTime" style="font-size: 10px; color: #a7a7a7;">0:00</span>
            </div>
        </div>
        
        <div class="player-controls">
            <button class="sec-btn" onclick="skipTime(-10)">-10</button>
            <button onclick="prevSong()">⏮</button>
            <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
            <button onclick="nextSong()">⏭</button>
            <button class="sec-btn" onclick="skipTime(10)">+10</button>
        </div>
    </div>

    <!-- AUDIO TAG -->
    <audio id="audioPlayer" preload="auto"></audio>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        let songs = [];
        let currentSongIndex = 0;
        let isPlaying = false;
        let searchTimeout;

        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const progressFill = document.getElementById('progressFill');
        const displayTitle = document.getElementById('displayTitle');
        const displayArtist = document.getElementById('displayArtist');
        const currTime = document.getElementById('currTime');
        const totalTime = document.getElementById('totalTime');
        const songListDiv = document.getElementById('songList');

        // ONLINE SEARCH FUNCTION (iTunes API use karke)
        function searchOnlineSongs() {
            const query = document.getElementById('searchInput').value;
            clearTimeout(searchTimeout);

            // Type karte waqt thoda wait karo (debounce)
            searchTimeout = setTimeout(() => {
                if (query.length < 2) return; 

                songListDiv.innerHTML = '<p style="color: #1ed760;">Searching online...</p>';

                // iTunes API call
                fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=10`)
                .then(response => response.json())
                .then(data => {
                    songs = data.results.map(item => ({
                        title: item.trackName,
                        artist: item.artistName,
                        // iTunes 30-second preview link deta hai jo 100% kaam karta hai
                        src: item.previewUrl, 
                        cover: item.artworkUrl100.replace('100x100', '300x300')
                    }));

                    renderSongs();
                })
                .catch(err => {
                    songListDiv.innerHTML = '<p style="color: red;">Internet error. Please check connection.</p>';
                });
            }, 800); // 800ms wait
        }

        // Cards ko screen par dikhana
        function renderSongs() {
            songListDiv.innerHTML = '';
            if (songs.length === 0) {
                songListDiv.innerHTML = '<p style="color: #a7a7a7;">No songs found.</p>';
                return;
            }

            songs.forEach((song, index) => {
                const card = document.createElement('div');
                card.className = 'music-card';
                card.onclick = () => playSong(index);
                card.innerHTML = `
                    <img src="${song.cover}" alt="${song.title}">
                    <p class="title">${song.title}</p>
                    <p class="subtitle">${song.artist}</p>
                `;
                songListDiv.appendChild(card);
            });
        }

        // Gaana Play karne ka function
        function playSong(index) {
            currentSongIndex = index;
            audio.src = songs[index].src;
            displayTitle.innerText = songs[index].title;
            displayArtist.innerText = songs[index].artist;
            
            audio.play().then(() => {
                isPlaying = true;
                playBtn.innerHTML = "⏸";
            }).catch(error => {
                alert("Server slow hai, thodi der baad try karein.");
            });
        }

        function togglePlay() {
            if (audio.src === "") return;
            
            if (isPlaying) {
                audio.pause();
                playBtn.innerHTML = "▶";
            } else {
                audio.play();
                playBtn.innerHTML = "⏸";
            }
            isPlaying = !isPlaying;
        }

        function nextSong() {
            currentSongIndex++;
            if (currentSongIndex >= songs.length) currentSongIndex = 0;
            playSong(currentSongIndex);
        }

        function prevSong() {
            currentSongIndex--;
            if (currentSongIndex < 0) currentSongIndex = songs.length - 1;
            playSong(currentSongIndex);
        }

        function skipTime(seconds) {
            if(audio.src !== "") {
                audio.currentTime += seconds;
            }
        }

        // Progress bar update
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = percent + "%";
                currTime.innerText = formatTime(audio.currentTime);
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            totalTime.innerText = formatTime(audio.duration);
        });

        audio.addEventListener('ended', nextSong);

        function seekAudio(e) {
            if(!audio.duration) return;
            const width = e.currentTarget.clientWidth;
            const clickX = e.offsetX;
            audio.currentTime = (clickX / width) * audio.duration;
        }

        function formatTime(seconds) {
            let m = Math.floor(seconds / 60);
            let s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }
    </script>
</body>
</html>
