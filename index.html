<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ARMA PLAY</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- MAIN APP -->
<div class="app">
  <!-- Mobile Top Bar -->
  <header class="top-bar">
    <div class="user-pill">J</div>
    <div class="filter-pills">
      <span class="pill active">All</span>
      <span class="pill">Music</span>
      <span class="pill">Podcasts</span>
    </div>
  </header>

  <!-- Content Area -->
  <main class="main-content">
    
    <!-- Section 1: Quick Picks (Square) -->
    <div class="section-title">Your top mixes</div>
    <div class="horizontal-scroll">
      <div class="card square">
        <div class="card-img" style="background:linear-gradient(45deg,#ff2d95,#7a5cff)">🎵</div>
        <div class="card-title">Daily Mix 1</div>
        <div class="card-sub">ARMA PLAY</div>
      </div>
      <div class="card square">
        <div class="card-img" style="background:linear-gradient(45deg,#00c6ff,#0072ff)">🎸</div>
        <div class="card-title">Rock Hits</div>
        <div class="card-sub">ARMA PLAY</div>
      </div>
      <div class="card square">
        <div class="card-img" style="background:linear-gradient(45deg,#f7971e,#ffd200)">🔥</div>
        <div class="card-title">Trending</div>
        <div class="card-sub">ARMA PLAY</div>
      </div>
    </div>

    <!-- Section 2: Jump back in (Wide Cards) -->
    <div class="section-title">Jump back in</div>
    <div class="horizontal-scroll">
      <div class="card wide" onclick="playById(tracks[0] ? tracks[0].id : '')">
        <div class="wide-img" style="background:linear-gradient(45deg,#1a1a1a,#333)">▶</div>
        <div class="wide-info">
          <div class="card-title">Recently Added</div>
          <div class="card-sub">Tap to play</div>
        </div>
      </div>
      <div class="card wide">
        <div class="wide-img" style="background:linear-gradient(45deg,#11998e,#38ef7d)">🎧</div>
        <div class="wide-info">
          <div class="card-title">Chill Vibes</div>
          <div class="card-sub">Playlist</div>
        </div>
      </div>
    </div>

    <!-- Section 3: All Songs List -->
    <div class="section-title" style="margin-top:20px;">All Songs</div>
    <div class="track-list" id="homeTrackList"></div>
    
    <!-- Add Music Button -->
    <button class="add-music-btn" onclick="document.getElementById('file').click()">
      <span>+ Add Music</span>
    </button>
    <input type="file" id="file" multiple accept="audio/*" style="display:none">
  </main>

  <!-- Bottom Navigation Bar (Spotify Style) -->
  <nav class="bottom-nav">
    <div class="nav-item active" onclick="switchView('home')">
      <span class="nav-icon">🏠</span>
      <span>Home</span>
    </div>
    <div class="nav-item" onclick="switchView('search')">
      <span class="nav-icon">🔍</span>
      <span>Search</span>
    </div>
    <div class="nav-item" onclick="switchView('library')">
      <span class="nav-icon">📚</span>
      <span>Library</span>
    </div>
  </nav>
</div>

<!-- Mini Player (Bottom) -->
<div class="mini-player" id="miniPlayer" style="display:none;">
  <div class="mini-left" onclick="document.getElementById('fullscreen').classList.add('show')">
    <div class="mini-img">🎵</div>
    <div class="mini-info">
      <div class="mini-title" id="npTitle">Track Name</div>
      <div class="mini-artist">ARMA PLAY</div>
    </div>
  </div>
  <div class="mini-controls">
    <button class="icon-btn" onclick="togglePlay()" id="playBtn">▶</button>
  </div>
</div>

<!-- Fullscreen Player -->
<div class="fullscreen" id="fullscreen">
  <div class="fs-header">
    <button class="icon-btn" onclick="document.getElementById('fullscreen').classList.remove('show')">▼</button>
    <span>Now Playing</span>
    <button class="icon-btn">⋯</button>
  </div>
  
  <div class="fs-cover" id="fsCover">🎵</div>
  
  <div class="fs-details">
    <h1 class="fs-title" id="fsTitle">Track Name</h1>
    <div class="fs-artist">ARMA PLAY</div>
  </div>

  <div class="fs-progress">
    <input type="range" id="seek" value="0" max="100" step="0.1">
    <div class="fs-times"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
  </div>

  <div class="fs-controls">
    <button class="icon-btn" id="shuffleBtn">🔀</button>
    <button class="icon-btn" onclick="prev()">⏮</button>
    <button class="play-btn-lg" onclick="togglePlay()" id="fsPlayBtn">▶</button>
    <button class="icon-btn" onclick="next()">⏭</button>
    <button class="icon-btn" id="repeatBtn">🔁</button>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>
<script src="script.js"></script>
</body>
</html>
