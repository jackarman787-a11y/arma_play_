<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARMA_PLAY MUSIC APP</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="top-bar">
            <div class="profile">J</div>
            <div class="filters">
                <button class="active">All</button>
                <button>Music</button>
                <button>Podcasts</button>
            </div>
        </div>
        
        <!-- Search Bar -->
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="What do you want to listen to?">
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="mainContent">
        
        <!-- Default Homepage Content (Shows when not searching) -->
        <div id="homeView">
            <h2 class="section-title">It's New Music Friday!</h2>
            <div class="horizontal-scroll">
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300&h=300&fit=crop" alt="Music">
                    <h4>New Music Friday India</h4>
                    <p>Lil Baby, JENNIE, Jack Harlow</p>
                </div>
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1493225457124-a1a2a5f5c92f?w=300&h=300&fit=crop" alt="Music">
                    <h4>Release Radar</h4>
                    <p>Catch all the latest music</p>
                </div>
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300&h=300&fit=crop" alt="Music">
                    <h4>Pop Hits</h4>
                    <p>Top 50 Global</p>
                </div>
            </div>

            <h2 class="section-title">Recommended Stations</h2>
            <div class="horizontal-scroll">
                <div class="card radio-card">
                    <img src="https://images.unsplash.com/photo-1516280440502-863a346513c1?w=300&h=300&fit=crop" alt="Arijit">
                    <h4>Arijit Singh Radio</h4>
                </div>
                <div class="card radio-card">
                    <img src="https://images.unsplash.com/photo-1501386761578-eac5c94b800a?w=300&h=300&fit=crop" alt="Karan">
                    <h4>Karan Aujla Radio</h4>
                </div>
            </div>
        </div>

        <!-- Search Results Area (Shows when typing) -->
        <div id="searchView" style="display: none;">
            <h2 class="section-title">Search Results</h2>
            <div id="searchResults"></div>
        </div>

    </main>

    <!-- Mini Player (Plays Music) -->
    <div id="miniPlayer" class="mini-player" style="display: none;">
        <img id="playerImg" src="" alt="Cover">
        <div class="player-info">
            <h5 id="playerTitle">Song Title</h5>
            <p id="playerArtist">Artist</p>
        </div>
        <audio id="audioPlayer" controls></audio>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="#" class="active"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="#"><i class="fa-solid fa-magnifying-glass"></i><span>Search</span></a>
        <a href="#"><i class="fa-solid fa-book-open"></i><span>Your Library</span></a>
        <a href="#"><i class="fa-brands fa-spotify"></i><span>Premium</span></a>
        <a href="#"><i class="fa-solid fa-plus"></i><span>Create</span></a>
    </nav>

    <script src="script.js"></script>
</body>
</html>
